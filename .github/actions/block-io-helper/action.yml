name: Prepare the Block I/O helper
description: Build and check the pinned helper on a disposable GitHub-hosted runner
inputs:
  prepare_kernel:
    description: Allow loading loop and dm_delay on this disposable runner
    default: 'false'
  directory:
    description: Directory for the helper check and source identities
    required: true
runs:
  using: composite
  steps:
    - name: Confirm the runner is disposable
      shell: bash
      run: test "$RUNNER_ENVIRONMENT" = github-hosted
    - name: Prepare the kernel
      if: inputs.prepare_kernel == 'true'
      shell: bash
      run: |
        sudo -n modprobe loop
        sudo -n modprobe dm_delay
    - uses: actions/checkout@v7
      id: source
      with:
        repository: JSYoo5B/ceph-testcontainers-images
        ref: 711be98130c5173ef63ce56edf48fbdbdfe086ba
        path: block-io-helper-source
        persist-credentials: false
    - name: Build and quick-check the pinned helper
      shell: bash
      env:
        HELPER_REVISION: ${{ steps.source.outputs.commit }}
        HELPER_REPORT_DIR: ${{ inputs.directory }}
      run: |
        test "$(git -C block-io-helper-source rev-parse HEAD)" = "$HELPER_REVISION"
        mkdir -p "$HELPER_REPORT_DIR"
        docker build --tag blockio-qualification:local block-io-helper-source/image/extensions/blockio
        helper=$(docker image inspect --format '{{.Id}}' blockio-qualification:local)
        printf '%s\n' "$(git rev-parse HEAD)" "$HELPER_REVISION" "$helper" > "$HELPER_REPORT_DIR/sources.txt"
        python3 block-io-helper-source/image/extension_check.py --extension blockio --image "$helper" \
          | tee "$HELPER_REPORT_DIR/helper-check.log"
        printf '%s\n' "CEPH_TEST_BLOCKIO_HELPER_IMAGE=$helper" "CEPH_TEST_BLOCKIO_REQUIRE_DELAY=1" >> "$GITHUB_ENV"
