name: Prepare published Ceph role images
description: Resolve existing native role images for a scenario without building them
inputs:
  artifact_name:
    description: Unique image identity artifact name for this scenario job
    required: true
  release:
    description: Ceph release published by ceph-testcontainers-images
    default: '20.2.4'
  roles:
    description: Comma-separated role images that the batch declares, essential included
    default: 'essential,client,cephfs,rbd-aux,rgw'
  digests:
    description: Comma-separated role=sha256:<digest> pins of the role tags; empty pulls the tags
    default: ''
runs:
  using: composite
  steps:
    - name: Resolve native role image identities
      id: resolve
      shell: bash
      env:
        SCENARIO_RELEASE: ${{ inputs.release }}
        SCENARIO_ROLES: ${{ inputs.roles }}
        SCENARIO_DIGESTS: ${{ inputs.digests }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../../scripts/run_image_matrix.py" \
          --contract roles-v2 --variant official --layout roles --release "$SCENARIO_RELEASE" --prepare-only \
          --roles "$SCENARIO_ROLES" --digests "$SCENARIO_DIGESTS" \
          --platform linux/amd64 --github-env "$GITHUB_ENV" \
          --output-dir artifacts/scenario-images
        printf '%s\n' 'SCENARIO_IMAGE_LAYOUT=roles' "SCENARIO_IMAGE_ROLES=$SCENARIO_ROLES" >> "$GITHUB_ENV"
    - name: Save selected image identities
      if: always()
      uses: actions/upload-artifact@v7
      with:
        retention-days: ${{ (job.status == 'failure' || steps.resolve.outcome == 'failure') && 14 || 7 }}
        name: ${{ inputs.artifact_name }}
        path: artifacts/scenario-images/
        if-no-files-found: error
