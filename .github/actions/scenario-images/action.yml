name: Prepare published Ceph role images
description: Pull the published role image tags of a scenario without building them
inputs:
  artifact_name:
    description: Unique image preparation artifact name for this scenario job
    required: true
  release:
    description: Ceph release published by ceph-testcontainers-images
    default: '20.2.4'
  roles:
    description: Comma-separated role images that the batch declares, essential included
    default: 'essential,client,cephfs,rbd-aux,rgw'
  platform:
    description: The planned native platform; preparation fails on a Docker engine of another one
    default: linux/amd64
runs:
  using: composite
  steps:
    - name: Prepare the role images by tag
      id: resolve
      shell: bash
      env:
        SCENARIO_RELEASE: ${{ inputs.release }}
        SCENARIO_ROLES: ${{ inputs.roles }}
        SCENARIO_PLATFORM: ${{ inputs.platform }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../../scripts/run_image_matrix.py" \
          --variant official --layout roles --release "$SCENARIO_RELEASE" --prepare-only \
          --roles "$SCENARIO_ROLES" \
          --platform "$SCENARIO_PLATFORM" --github-env "$GITHUB_ENV" \
          --output-dir artifacts/scenario-images
        printf '%s\n' 'SCENARIO_IMAGE_LAYOUT=roles' "SCENARIO_IMAGE_ROLES=$SCENARIO_ROLES" >> "$GITHUB_ENV"
    - name: Save the image preparation summary
      if: always()
      uses: actions/upload-artifact@v7
      with:
        retention-days: ${{ (job.status == 'failure' || steps.resolve.outcome == 'failure') && 14 || 7 }}
        name: ${{ inputs.artifact_name }}
        path: artifacts/scenario-images/
        if-no-files-found: error
