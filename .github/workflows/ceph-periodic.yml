name: Ceph periodic

# The full matrix on main: every runtime category on Tentacle 20.2.4 and on
# Squid 19.2.5. Pull requests run Code checks, Docker checks and Ceph short on
# Tentacle, and only the changed batches of the other categories, so this is
# where every batch runs on both releases.
#
# The schedule fires every 3 hours; the Gate job (periodic_gate.py) lets the
# matrix run only for a commit of main that no earlier run executed, for a
# weekly repeat of an unchanged commit, or on every firing while the
# repository variable CI_RELEASE_PHASE is "true". Repeated runs of one commit
# show which profiles fail without a source change.
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A new run waits for the one in progress instead of cancelling it, so every
# started run finishes and counts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Decide whether the matrix runs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RELEASE_PHASE: ${{ vars.CI_RELEASE_PHASE }}
        run: python3 .github/scripts/periodic_gate.py --workflow ceph-periodic.yml
  environment:
    name: Environment
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: environment
      check_name: Ceph periodic environment
  tentacle-short:
    name: Tentacle short
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: short
      check_name: Ceph periodic tentacle short
      release: '20.2.4'
  tentacle-topology:
    name: Tentacle topology
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: topology
      check_name: Ceph periodic tentacle topology
      release: '20.2.4'
  tentacle-multicluster:
    name: Tentacle multicluster
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: multicluster
      check_name: Ceph periodic tentacle multicluster
      release: '20.2.4'
  tentacle-recovery:
    name: Tentacle recovery
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: recovery
      check_name: Ceph periodic tentacle recovery
      release: '20.2.4'
  squid-short:
    name: Squid short
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: short
      check_name: Ceph periodic squid short
      release: '19.2.5'
  squid-topology:
    name: Squid topology
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: topology
      check_name: Ceph periodic squid topology
      release: '19.2.5'
  squid-multicluster:
    name: Squid multicluster
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: multicluster
      check_name: Ceph periodic squid multicluster
      release: '19.2.5'
  squid-recovery:
    name: Squid recovery
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: recovery
      check_name: Ceph periodic squid recovery
      release: '19.2.5'
