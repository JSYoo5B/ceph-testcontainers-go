name: Ceph periodic

# One daily allocation: random supported-release batches on
# five days; historical/new patch discovery on Tuesday and Friday (UTC).
# Full matrices and repeated representative campaigns require manual dispatch.
# Every sample publishes one frozen source/image/test plan before execution.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: rotate/discovery flaky samples; targeted reproduces selected tests; full/representative/storage are explicit investigations
        type: choice
        options: [rotate, discovery, targeted, full, representative, storage]
        default: rotate
      storage_policy:
        description: Storage qualification only; auto skips when safe, always is the control, pressure exercises reclamation; pressure-supplemental exhausts standard cleanup first
        type: choice
        options: [auto, always, pressure, pressure-supplemental]
        default: auto
      storage_profiles:
        description: Comma-separated source-owned profile IDs for explicit storage qualification only
        type: string
        default: short-rados_fixtures_watchers-52f45dc3
      repetitions:
        description: Attempts of each representative batch (representative only, 1 to 10)
        type: number
        default: 1
      release:
        description: Ceph release of the role images (representative and storage only)
        type: choice
        options: ['20.2.4', '21.2.0', '19.2.5']
        default: '20.2.4'
      ref:
        description: Source ref for sampled, representative and storage runs; full uses the dispatched commit; empty uses the dispatched commit
        type: string
        default: ''
      patch:
        description: Exact catalogued patch for targeted runs; historical patches are not support declarations
        type: string
        default: ''
      profiles:
        description: Comma-separated exact profile IDs (targeted only)
        type: string
        default: ''
      tests:
        description: Comma-separated exact parent tests within the selected profiles (targeted only); empty runs those complete profiles
        type: string
        default: ''
      network:
        description: Targeted network; default uses the profile's declared default
        type: choice
        options: [default, host, bridge]
        default: default

permissions:
  contents: read
  actions: read

# Bounded, full and storage runs share one group; none can overlap them.
# Explicit representative investigations have a separate bounded group.
# No daily firing starts a repeated representative campaign.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.mode == 'representative' && '-campaign' || '' }}
  cancel-in-progress: false

env:
  # A failed request to the module proxy, such as a reset HTTP/2 stream,
  # falls back to the module's origin; go.sum verifies either source.
  GOPROXY: 'https://proxy.golang.org|direct'

jobs:
  sample-plan:
    name: Sample plan
    if: github.event_name == 'schedule' || inputs.mode == 'rotate' || inputs.mode == 'discovery' || inputs.mode == 'targeted'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Freeze source, images and selected contracts
        id: plan
        env:
          SAMPLE_MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode }}
          SAMPLE_RELEASE: ${{ inputs.patch || inputs.release }}
          SAMPLE_PROFILES: ${{ inputs.profiles }}
          SAMPLE_TESTS: ${{ inputs.tests }}
          SAMPLE_NETWORK: ${{ inputs.network }}
        run: |
          sha=$(git rev-parse HEAD)
          python3 .github/scripts/tag_scenarios.py modules --directory artifacts/plan-modules
          python3 .github/scripts/periodic_selection.py --mode "$SAMPLE_MODE" --source "$sha" --release "$SAMPLE_RELEASE" --profiles "$SAMPLE_PROFILES" --tests "$SAMPLE_TESTS" --network "$SAMPLE_NETWORK" --freeze-images --output artifacts/periodic-plan.json
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Publish the plan before native work
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: periodic-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/periodic-plan.json
          if-no-files-found: warn
          retention-days: 14
  sample:
    name: Sequential sample
    needs: sample-plan
    runs-on: ubuntu-24.04
    # The executor admits work within 110 minutes, leaving upload/cleanup margin.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.sample-plan.outputs.sha }}
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Restore the Go build cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - uses: actions/download-artifact@v8
        with:
          name: periodic-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/plan
      - name: Run independent contracts in this allocation
        env:
          CGO_ENABLED: '0'
        run: python3 .github/scripts/periodic_execute.py execute --plan artifacts/plan/periodic-plan.json --directory artifacts/periodic
      - name: Save per-case evidence and selection outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: periodic-sample-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/periodic/
            !artifacts/periodic/**/compile/*.test
          retention-days: 14
          if-no-files-found: warn
  gate:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'representative')
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      campaign: ${{ steps.gate.outputs.campaign }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Decide whether the matrix or the campaign runs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RELEASE_PHASE: ${{ vars.CI_RELEASE_PHASE }}
          PERIODIC_SCHEDULE: ${{ github.event.schedule }}
          PERIODIC_MODE: ${{ inputs.mode }}
        run: python3 .github/scripts/periodic_gate.py --workflow ceph-periodic.yml --campaign-schedule '23 4 * * *'
  environment:
    name: Environment
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: environment
      check_name: Ceph periodic environment
      # tag_scenarios.ENVIRONMENT_MAX_PARALLEL
      max_parallel: 1
  releases:
    name: Releases
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      # Fails unless the callers run every required profile on every
      # supported release exactly once.
      - name: Expand supported releases and prove required coverage
        id: releases
        run: python3 .github/scripts/tag_scenarios.py releases --scope all --check-prefix 'Ceph periodic' --github-output "$GITHUB_OUTPUT"
  runtime:
    name: ${{ matrix.title }}
    needs: releases
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.releases.outputs.matrix) }}
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: ${{ matrix.category }}
      check_name: ${{ matrix.check_name }}
      release: ${{ matrix.release }}
      # tag_scenarios.RELEASE_MAX_PARALLEL: every release caller together
      # leaves tag_scenarios.PULL_REQUEST_RUNNERS for pull requests.
      max_parallel: ${{ matrix.max_parallel }}
  # The representative campaign. Pin fixes the commit and the role image
  # digests once; every attempt of Representative then runs exactly those, on
  # its own runner, with its repetition ID in its history row.
  pin:
    name: Pin
    needs: gate
    if: needs.gate.outputs.campaign == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      release: ${{ steps.images.outputs.release }}
      digests: ${{ steps.images.outputs.digests }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pin the commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$CAMPAIGN_REF" ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CAMPAIGN_REF" --jq .sha)
          else
            sha=$GITHUB_SHA
          fi
          echo "Campaign commit: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Pin the role images to registry digests
        id: images
        env:
          CAMPAIGN_RELEASE: ${{ inputs.release || '20.2.4' }}
        run: python3 .github/scripts/periodic_campaign.py pin --release "$CAMPAIGN_RELEASE" --github-output "$GITHUB_OUTPUT"
  representative:
    name: Representative
    needs: pin
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: default
      # tag_scenarios.CAMPAIGN_MAX_PARALLEL: what a full matrix run, which
      # can run at the same time, leaves of the periodic runner budget.
      max_parallel: 3
      category: representative
      check_name: Ceph periodic representative
      release: ${{ needs.pin.outputs.release }}
      # The dispatch input reaches the call as a string; the reusable
      # workflow's number input refuses it unless converted.
      repetitions: ${{ fromJSON(inputs.repetitions || 1) }}
      ref: ${{ needs.pin.outputs.sha }}
      role_digests: ${{ needs.pin.outputs.digests }}
  # One bounded workload per explicitly requested run. Dispatch the same ref
  # repeatedly with auto/always/pressure for equivalent-source comparisons.
  storage:
    name: Storage qualification
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'storage'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      category: selected
      profiles: ${{ inputs.storage_profiles }}
      check_name: Runner storage qualification
      max_parallel: 5
      networks: default
      release: ${{ inputs.release }}
      ref: ${{ inputs.ref || github.sha }}
      storage_policy: ${{ inputs.storage_policy }}
  # Durable history: the rows of this run's jobs go to the scenario-history
  # branch, one append-only file per run attempt, and summary.json there is
  # recomputed. A branch keeps rows without expiry (artifacts expire, caches
  # are evicted) and needs no service outside the repository; every update
  # is a commit. The runtime jobs read summary.json for their failure notes.
  history:
    name: History
    needs: [gate, environment, releases, runtime, pin, representative, storage, sample-plan, sample]
    if: always() && (needs.gate.outputs.run == 'true' || needs.gate.outputs.campaign == 'true' || needs.sample-plan.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download this run's history rows
        if: needs.sample-plan.result != 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: tag-scenario-*
          path: artifacts/rows
      - name: Download the packed periodic receipt
        if: needs.sample-plan.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: periodic-sample-*
          path: artifacts/rows
      - name: Store the rows on the scenario-history branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q history
          cd history
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          for attempt in 1 2 3 4 5; do
            if git -c http.extraheader="$auth" ls-remote --exit-code origin refs/heads/scenario-history > /dev/null; then
              git -c http.extraheader="$auth" fetch -q --depth=1 origin scenario-history
              git checkout -q -f -B scenario-history FETCH_HEAD
              git clean -fdq
            else
              git symbolic-ref HEAD refs/heads/scenario-history
            fi
            python3 ../.github/scripts/scenario_history.py collect --history-dir . --rows ../artifacts/rows
            git add -A .
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -q -m "Scenario history of run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            if git -c http.extraheader="$auth" push -q origin HEAD:refs/heads/scenario-history; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
