name: Topology

# Development PRs run changed batches or the full category with ci:full. Release candidates run the full Release matrix.

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'internal/integration/goceph/**'
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited, labeled]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'internal/integration/goceph/**'
  workflow_dispatch:

permissions:
  contents: read

# Adding a label other than ci:full starts a run that does nothing; its own
# group keeps it from cancelling the pull request's run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:full' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: Scenarios
    if: >-
      github.event_name != 'push' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      category: topology
      check_name: Topology
      changed_since: >-
        ${{ github.event_name == 'pull_request' &&
        !contains(github.event.pull_request.labels.*.name, 'ci:full') &&
        github.event.pull_request.base.sha || '' }}
      changed_head: >-
        ${{ github.event_name == 'pull_request' &&
        !contains(github.event.pull_request.labels.*.name, 'ci:full') &&
        github.event.pull_request.head.sha || '' }}
