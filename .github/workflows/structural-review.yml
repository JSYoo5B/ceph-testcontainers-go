name: Structural review comment

# This privileged job runs trusted default-branch code only. Artifacts are data;
# the publisher never checks out, imports or executes pull-request code.
on:
  workflow_run:
    workflows: [Code checks]
    types: [completed]
    # Filter the source run before GitHub creates a publisher run for main CI.
    # This matches the source branch, not the branch holding this trusted file.
    branches-ignore: [main]

permissions: {}

concurrency:
  group: structural-report-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Update the structural report for the current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: >-
          python3 .github/scripts/publish_structural_review.py
          --run "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT"
