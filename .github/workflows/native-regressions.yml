name: Native regressions

on:
  workflow_dispatch:
    inputs:
      rgw_image:
        description: Existing RGW role image for strict upstream regressions (empty uses published role; no build)
        type: string
        default: ''
      failure_archive:
        description: 'Run the deliberately FAILED native failure-archive proof instead of RGW regressions'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  regressions:
    name: Scenarios
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      category: optional
      check_name: Manual native checks
      optional_batch: ${{ inputs.failure_archive && 'failure_archive' || 'native_rgw_translation' }}
      rgw_image: ${{ inputs.rgw_image }}
