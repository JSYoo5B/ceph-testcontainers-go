name: Native regressions

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Optional batch: a deliberately failing upstream reproducer, or the failure-archive proof'
        type: choice
        default: native_rgw_translation
        options:
          - native_rgw_translation
          - native_shuffle
          - cephfs_dangling_symlink_create
          - cephfs_readdir_after_snapdiff
          - cephfs_statfs_mixed_quota
          - cephfs_snapshot_readdir_eviction
          - mon_log_ack
          - rbd_demote_restart
          - rbd_trash_purge_timezone
          - rgw_conditional_writes
          - rgw_ssec_completion
          - rgw_empty_sse_header
          - rgw_expiration_header
          - rgw_compressed_copy
          - rgw_multipart_part_class
          - rgw_object_lock_sync
          - rgw_sync_lease_lapse
          - failure_archive
      release:
        description: Supported Ceph release whose pinned role images the batch runs on; a reproduction case expects the verdicts its reproductions.json records for them
        type: choice
        options: ['20.2.4', '21.2.0', '19.2.5']
        default: '20.2.4'
      rgw_image:
        description: Existing RGW role image for native_rgw_translation (empty uses published role; no build)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  regressions:
    name: Scenarios
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      category: optional
      check_name: Manual native checks
      optional_batch: ${{ inputs.batch }}
      release: ${{ inputs.release }}
      rgw_image: ${{ inputs.rgw_image }}
