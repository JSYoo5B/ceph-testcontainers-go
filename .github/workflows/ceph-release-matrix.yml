name: Ceph release matrix

# In a release phase (repository variable CI_RELEASE_PHASE is "true"), every
# pull request and push to main also runs every runtime category on Squid
# 19.2.5. Outside it, this workflow skips its jobs and Ceph periodic covers
# Squid on main.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'internal/integration/goceph/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'internal/integration/goceph/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  squid-short:
    name: Squid short
    if: vars.CI_RELEASE_PHASE == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: short
      check_name: Ceph release matrix squid short
      release: '19.2.5'
  squid-topology:
    name: Squid topology
    if: vars.CI_RELEASE_PHASE == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: topology
      check_name: Ceph release matrix squid topology
      release: '19.2.5'
  squid-multicluster:
    name: Squid multicluster
    if: vars.CI_RELEASE_PHASE == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: multicluster
      check_name: Ceph release matrix squid multicluster
      release: '19.2.5'
  squid-recovery:
    name: Squid recovery
    if: vars.CI_RELEASE_PHASE == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      networks: all
      category: recovery
      check_name: Ceph release matrix squid recovery
      release: '19.2.5'
