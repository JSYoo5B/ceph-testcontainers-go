name: Ceph recovery

# Runtime batches never read documentation or the separately built go-ceph
# probe module, so a change to those alone runs only Code checks.
#
# This category does not gate every merge. A pull request runs only the
# batches whose own test files it changes, or every batch when it has the
# ci:full label or while the repository variable CI_RELEASE_PHASE is "true".
# Ceph periodic runs every batch on main.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'internal/integration/goceph/**'
  workflow_dispatch:

permissions:
  contents: read

# Adding a label other than ci:full starts a run that does nothing; its own
# group keeps it from cancelling the pull request's run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:full' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: Scenarios
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      category: recovery
      check_name: Ceph recovery
      changed_since: >-
        ${{ github.event_name == 'pull_request' &&
        !contains(github.event.pull_request.labels.*.name, 'ci:full') &&
        vars.CI_RELEASE_PHASE != 'true' &&
        github.event.pull_request.base.sha || '' }}
      changed_head: >-
        ${{ github.event_name == 'pull_request' &&
        !contains(github.event.pull_request.labels.*.name, 'ci:full') &&
        vars.CI_RELEASE_PHASE != 'true' &&
        github.event.pull_request.head.sha || '' }}
