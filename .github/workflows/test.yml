name: test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rgw_native_regressions:
        description: Run strict optional RGW native defect regressions
        type: boolean
        default: false
      rgw_image:
        description: Existing RGW image for optional regressions (empty uses default image; no build)
        type: string
        default: ''

permissions:
  contents: read

# Tests and Docker share the Linux runner host. These jobs consume existing
# Default/prebuilt images and never compile Ceph or generate/publish role images.
env:
  TESTCONTAINERS_HOST_OVERRIDE: '127.0.0.1'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - run: make check
      - name: Check supplied-image Linux runner without Docker
        run: python3 -m unittest discover -s internal/integration/goceph -p test_run.py -v
      - name: Check image matrix selection without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_run_image_matrix.py -v
      - name: Check cleanup observations without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_check_runtime_cleanup.py -v

  image-compatibility:
    name: image / ${{ matrix.variant }} / ${{ matrix.layout }} / ${{ matrix.architecture.name }}
    needs: test
    runs-on: ${{ matrix.architecture.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [official, debian, ubuntu]
        layout: [all, roles]
        architecture:
          - name: amd64
            runner: ubuntu-24.04
          - name: arm64
            runner: ubuntu-24.04-arm
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
      - name: Verify published images with the Go module
        run: >-
          python3 .github/scripts/run_image_matrix.py
          --variant '${{ matrix.variant }}'
          --layout '${{ matrix.layout }}'
          --platform 'linux/${{ matrix.architecture.name }}'
          --output-dir artifacts/image-matrix
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-image-${{ matrix.variant }}-${{ matrix.layout }}-${{ matrix.architecture.name }}
      - name: Save image identities and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.variant }}-${{ matrix.layout }}-${{ matrix.architecture.name }}
          path: artifacts/image-matrix/
          if-no-files-found: error

  scenario-default:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
      - run: make scenario-default
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-default

  scenario-topology:
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
      - run: make scenario-topology
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-topology

  scenario-multicluster-topology:
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
      - run: make scenario-multicluster-topology
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-multicluster-topology

  scenario-topology-extensions:
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
      - name: Verify Docker bridge endpoint recovery
        run: go test -mod=readonly -tags=integration -count=1 -v -timeout=5m -run '^TestRecoverableBridge(EndpointIdentity|PublishedPort)$' ./internal/dockerbridge
      - name: Run make scenario-topology-extensions
        shell: bash
        run: make scenario-topology-extensions 2>&1 | tee "$RUNNER_TEMP/scenario-topology-extensions.log"
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-topology-extensions
      - name: Identify failed topology cases
        if: failure()
        run: python3 .github/scripts/report_test_failures.py "$RUNNER_TEMP/scenario-topology-extensions.log" --profile scenario-topology-extensions

  scenario-cluster-fixtures:
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
      - name: Run make scenario-cluster-fixtures
        shell: bash
        run: make scenario-cluster-fixtures 2>&1 | tee "$RUNNER_TEMP/scenario-cluster-fixtures.log"
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-cluster-fixtures
      - name: Identify failed cluster fixture cases
        if: failure()
        continue-on-error: true
        run: python3 .github/scripts/report_test_failures.py "$RUNNER_TEMP/scenario-cluster-fixtures.log" --profile scenario-cluster-fixtures

  scenario-cephfs-fixtures:
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
