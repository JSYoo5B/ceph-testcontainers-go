  # Linux go-ceph remains an optional supplied-image Make target.
  # Image checker CI is independent of this module and its consumer SDKs.

  rgw-native-regressions:
    if: github.event_name == 'workflow_dispatch' && inputs.rgw_native_regressions
    needs: [scenario-topology, scenario-multicluster-topology, scenario-topology-extensions]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CGO_ENABLED: '0'
      CEPH_TEST_RGW_IMAGE: ${{ inputs.rgw_image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
