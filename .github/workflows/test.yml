      - name: Identify failed CephFS fixture cases
        if: failure()
        continue-on-error: true
        run: python3 .github/scripts/report_test_failures.py "$RUNNER_TEMP/scenario-cephfs-fixtures.log" --profile scenario-cephfs-fixtures

  scenario-rados-fixtures:
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      CGO_ENABLED: '0'
    steps:
