name: test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rgw_native_regressions:
        description: Run strict optional RGW native defect regressions
        type: boolean
        default: false
      rgw_image:
        description: Existing RGW role image for optional regressions (empty uses published RGW role; no build)
        type: string
        default: ''

permissions:
  contents: read

env:
  TESTCONTAINERS_HOST_OVERRIDE: '127.0.0.1'

jobs:
  code-check:
    name: code / unit, race, vet and tagged helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - run: make check
      - name: Check supplied-image Linux consumer harness without Docker
        run: python3 -m unittest discover -s internal/integration/goceph -p test_run.py -v
      - name: Check supplied-image preparation without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_run_image_matrix.py -v
      - name: Check cleanup observations without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_check_runtime_cleanup.py -v
      - name: Check tag discovery and execution boundaries without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_tag_scenarios.py -v
      - name: Check workflow coverage and execution phases without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_scenario_shards.py -v
      - name: Check CephFS quiescence completion gate without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_scenario_quiescence.py -v
      - name: Check CephFS recovery completion gate without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_scenario_recovery.py -v
      - name: Check receiver scope completion gate without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_scenario_receivers.py -v
      - name: Check prepared image and manual target boundaries without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_scenario_images.py -v
      - name: Run code-only tagged tests
        run: python3 .github/scripts/tag_scenarios.py code --directory artifacts/tag-code
      - name: Save code-only test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tag-code
          path: artifacts/tag-code/
          if-no-files-found: warn

  plan:
    name: code / compiled tag coverage and execution plan
    needs: code-check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Discover and verify every compiled tag batch
        id: plan
        run: python3 .github/scripts/tag_scenarios.py plan --verify --output artifacts/tag-plan.json --github-output "$GITHUB_OUTPUT"
      - name: Save discovered coverage and plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tag-plan
          path: artifacts/tag-plan.json
          if-no-files-found: error

  runtime:
    name: runtime-${{ matrix.category }} / ${{ matrix.batch }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Code - compile the selected tagged suite
        run: python3 .github/scripts/tag_scenarios.py compile --category '${{ matrix.category }}' --batch '${{ matrix.batch }}' --package '${{ matrix.package }}' --directory artifacts/scenario/compile
      - name: Environment - record Docker engine and owned resources
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-${{ matrix.id }}
      - name: Environment - resolve native published Ceph roles
        if: matrix.requires_ceph
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-${{ matrix.id }}
      - name: Native - run tagged assertions and completion gates
        run: python3 .github/scripts/tag_scenarios.py run --category '${{ matrix.category }}' --batch '${{ matrix.batch }}' --package '${{ matrix.package }}' --directory artifacts/scenario/native
      - name: Cleanup - verify owned Docker resource absence
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-${{ matrix.id }}
      - name: Save compile, native and completion results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tag-scenario-${{ matrix.id }}
          path: artifacts/scenario/
          if-no-files-found: warn
      - name: Identify completed failing tests
        if: failure()
        continue-on-error: true
        run: python3 .github/scripts/report_test_failures.py artifacts/scenario/native/native.log --profile tag-scenario

  rgw-native-regressions:
    name: optional / RGW native regressions
    if: github.event_name == 'workflow_dispatch' && inputs.rgw_native_regressions
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Environment - record owned resources
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-rgw-sync-native-regressions
      - name: Environment - resolve published Ceph roles
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-rgw-sync-native-regressions
      - name: Run strict RGW native regressions
        env:
          CEPH_TEST_RGW_IMAGE: ${{ inputs.rgw_image || env.CEPH_TEST_RGW_IMAGE }}
        run: python3 .github/scripts/tag_scenarios.py optional --batch native_rgw_translation --directory artifacts/optional-native
      - name: Cleanup - verify owned resource absence
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-rgw-sync-native-regressions
      - name: Save optional native completion results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tag-optional-rgw
          path: artifacts/optional-native/
          if-no-files-found: warn
