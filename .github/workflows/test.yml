name: test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rgw_native_regressions:
        description: Run strict optional RGW native defect regressions
        type: boolean
        default: false
      rgw_image:
        description: Existing RGW image for optional regressions (empty uses default image; no build)
        type: string
        default: ''

permissions:
  contents: read

# Tests and Docker share the Linux runner host. These jobs consume existing
# Default/prebuilt images and never compile Ceph or generate/publish role images.
env:
  TESTCONTAINERS_HOST_OVERRIDE: '127.0.0.1'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - run: make check
      - name: Check supplied-image Linux runner without Docker
        run: python3 -m unittest discover -s internal/integration/goceph -p test_run.py -v
      - name: Check image matrix selection without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_run_image_matrix.py -v
      - name: Check cleanup observations without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_check_runtime_cleanup.py -v
      - name: Check scenario shard coverage without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_scenario_shards.py -v
      - name: Check primary scenario image selection without Docker
        run: python3 -m unittest discover -s .github/scripts -p test_scenario_images.py -v

  image-compatibility:
    name: image / ${{ matrix.variant }} / ${{ matrix.layout }} / ${{ matrix.architecture.name }}
    needs: test
    runs-on: ${{ matrix.architecture.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [official, debian, ubuntu]
        layout: [all, roles]
        architecture:
          - name: amd64
            runner: ubuntu-24.04
          - name: arm64
            runner: ubuntu-24.04-arm
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-image-${{ matrix.variant }}-${{ matrix.layout }}-${{ matrix.architecture.name }}
      - name: Verify published images with the Go module
        run: >-
          python3 .github/scripts/run_image_matrix.py
          --variant '${{ matrix.variant }}'
          --layout '${{ matrix.layout }}'
          --platform 'linux/${{ matrix.architecture.name }}'
          --output-dir artifacts/image-matrix
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-image-${{ matrix.variant }}-${{ matrix.layout }}-${{ matrix.architecture.name }}
      - name: Save image identities and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.variant }}-${{ matrix.layout }}-${{ matrix.architecture.name }}
          path: artifacts/image-matrix/
          if-no-files-found: error

  scenario-default:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-scenario-default
      - name: Prepare published Ceph role images
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-scenario-default
      - run: make scenario-default
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-default

  scenario-topology:
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-scenario-topology
      - name: Prepare published Ceph role images
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-scenario-topology
      - run: make scenario-topology
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-topology

  scenario-multicluster-topology:
    name: multicluster / ${{ matrix.group }}
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        group: [infra, rbd, cephfs, rgw-endpoints-host, rgw-multisite-bridge, rgw-multisite-host, rgw-three-zone-bridge, rgw-three-zone-host, rgw-master-failover]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-multicluster-${{ matrix.group }}
      - name: Prepare published Ceph role images
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-multicluster-${{ matrix.group }}
      - name: Run multicluster shard
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/scenario
          make scenario-multicluster-topology SCENARIO_MULTICLUSTER_GROUP='${{ matrix.group }}' SCENARIO_MULTICLUSTER_TOPOLOGY_TIMEOUT=60m 2>&1 | tee artifacts/scenario/test.log
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-multicluster-${{ matrix.group }}
      - name: Save scenario results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-multicluster-${{ matrix.group }}
          path: artifacts/scenario/
          if-no-files-found: warn

  scenario-cephfs-removal:
    name: cephfs removal / ${{ matrix.case }}
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        case: [peer-drain, directory-release, process-quiescence, process-recovery, directory-intent]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-cephfs-removal-${{ matrix.case }}
      - name: Prepare published Ceph role images
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-cephfs-removal-${{ matrix.case }}
      - name: Run CephFS removal case
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/scenario
          make scenario-cephfs-removal SCENARIO_CEPHFS_REMOVAL_CASE='${{ matrix.case }}' SCENARIO_CEPHFS_REMOVAL_TIMEOUT=60m 2>&1 | tee artifacts/scenario/test.log
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-cephfs-removal-${{ matrix.case }}
      - name: Save scenario results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-cephfs-removal-${{ matrix.case }}
          path: artifacts/scenario/
          if-no-files-found: warn

  scenario-rbd-receivers:
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-scenario-rbd-receivers
      - name: Prepare published Ceph role images
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-scenario-rbd-receivers
      - run: make scenario-rbd-receivers
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-rbd-receivers

  scenario-topology-extensions:
    name: topology extension / ${{ matrix.case }}
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        case: [network-interruption, five-monitors, rbd-mirror-bridge, rbd-mirror-host, cephfs-mirror-bridge, cephfs-mirror-host, rgw-initial-bridge, rgw-initial-host, rgw-removal-bridge, rgw-removal-host, rbd-peer-network, rgw-peer-network]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-scenario-topology-extensions-${{ matrix.case }}
      - name: Prepare published Ceph role images
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-scenario-topology-extensions-${{ matrix.case }}
      - name: Verify Docker bridge endpoint recovery
        if: ${{ matrix.case == 'network-interruption' }}
        run: go test -mod=readonly -tags=integration -count=1 -v -timeout=5m -run '^TestRecoverableBridge(EndpointIdentity|PublishedPort)$' ./internal/dockerbridge
      - name: Run make scenario-topology-extensions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/scenario
          make scenario-topology-extensions SCENARIO_TOPOLOGY_EXTENSION_CASE='${{ matrix.case }}' TOPOLOGY_EXTENSIONS_TIMEOUT=40m 2>&1 | tee artifacts/scenario/test.log
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-topology-extensions-${{ matrix.case }}
      - name: Identify failed topology cases
        if: failure()
        run: python3 .github/scripts/report_test_failures.py artifacts/scenario/test.log --profile 'scenario-topology-extensions-${{ matrix.case }}'

      - name: Save scenario results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-topology-extensions-${{ matrix.case }}
          path: artifacts/scenario/
          if-no-files-found: warn

  scenario-cluster-fixtures:
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-scenario-cluster-fixtures
      - name: Prepare published Ceph role images
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-scenario-cluster-fixtures
      - name: Run make scenario-cluster-fixtures
        shell: bash
        run: make scenario-cluster-fixtures 2>&1 | tee "$RUNNER_TEMP/scenario-cluster-fixtures.log"
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-cluster-fixtures
      - name: Identify failed cluster fixture cases
        if: failure()
        continue-on-error: true
        run: python3 .github/scripts/report_test_failures.py "$RUNNER_TEMP/scenario-cluster-fixtures.log" --profile scenario-cluster-fixtures

  scenario-cephfs-fixtures:
    name: cephfs fixture / ${{ matrix.case }}
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        case: [data-pools, clone-cancellation, quiesce, authorization, pins, retained-snapshot, ec-data-pool, host-filesystem]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-scenario-cephfs-fixtures-${{ matrix.case }}
      - name: Prepare published Ceph role images
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-scenario-cephfs-fixtures-${{ matrix.case }}
      - name: Run make scenario-cephfs-fixtures
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/scenario
          make scenario-cephfs-fixtures SCENARIO_CEPHFS_FIXTURE_CASE='${{ matrix.case }}' CLIENT_FIXTURES_TIMEOUT=40m 2>&1 | tee artifacts/scenario/test.log
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-cephfs-fixtures-${{ matrix.case }}
      - name: Identify failed CephFS fixture cases
        if: failure()
        continue-on-error: true
        run: python3 .github/scripts/report_test_failures.py artifacts/scenario/test.log --profile 'scenario-cephfs-fixtures-${{ matrix.case }}'

      - name: Save scenario results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-cephfs-fixtures-${{ matrix.case }}
          path: artifacts/scenario/
          if-no-files-found: warn

  scenario-rados-fixtures:
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-scenario-rados-fixtures
      - name: Prepare published Ceph role images
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-scenario-rados-fixtures
      - name: Run make scenario-rados-fixtures
        shell: bash
        run: make scenario-rados-fixtures 2>&1 | tee "$RUNNER_TEMP/scenario-rados-fixtures.log"
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-rados-fixtures
      - name: Identify failed RADOS fixture cases
        if: failure()
        continue-on-error: true
        run: python3 .github/scripts/report_test_failures.py "$RUNNER_TEMP/scenario-rados-fixtures.log" --profile scenario-rados-fixtures

  scenario-rbd-fixtures:
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-scenario-rbd-fixtures
      - name: Prepare published Ceph role images
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-scenario-rbd-fixtures
      - name: Run make scenario-rbd-fixtures
        shell: bash
        run: make scenario-rbd-fixtures 2>&1 | tee "$RUNNER_TEMP/scenario-rbd-fixtures.log"
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-rbd-fixtures
      - name: Identify failed RBD fixture cases
        if: failure()
        continue-on-error: true
        run: python3 .github/scripts/report_test_failures.py "$RUNNER_TEMP/scenario-rbd-fixtures.log" --profile scenario-rbd-fixtures

  scenario-rgw-fixtures:
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-scenario-rgw-fixtures
      - name: Prepare published Ceph role images
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-scenario-rgw-fixtures
      - name: Run make scenario-rgw-fixtures
        shell: bash
        run: make scenario-rgw-fixtures 2>&1 | tee "$RUNNER_TEMP/scenario-rgw-fixtures.log"
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-rgw-fixtures
      - name: Identify failed RGW fixture cases
        if: failure()
        continue-on-error: true
        run: python3 .github/scripts/report_test_failures.py "$RUNNER_TEMP/scenario-rgw-fixtures.log" --profile scenario-rgw-fixtures

  scenario-rgw-sync-fixtures:
    name: rgw sync / ${{ matrix.group }}
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        group: [policy, account, translation]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-rgw-sync-${{ matrix.group }}
      - name: Prepare published Ceph role images
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-rgw-sync-${{ matrix.group }}
      - name: Run RGW sync shard
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/scenario
          make scenario-rgw-sync-fixtures SCENARIO_RGW_SYNC_GROUP='${{ matrix.group }}' MULTICLUSTER_TIMEOUT=40m 2>&1 | tee artifacts/scenario/test.log
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-rgw-sync-${{ matrix.group }}
      - name: Save scenario results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-rgw-sync-${{ matrix.group }}
          path: artifacts/scenario/
          if-no-files-found: warn
      - name: Identify failed RGW sync fixture cases
        if: failure()
        continue-on-error: true
        run: python3 .github/scripts/report_test_failures.py artifacts/scenario/test.log --profile 'scenario-rgw-sync-${{ matrix.group }}'

  # Linux go-ceph remains an optional supplied-image Make target.
  # Image checker CI is independent of this module and its consumer SDKs.

  rgw-native-regressions:
    if: github.event_name == 'workflow_dispatch' && inputs.rgw_native_regressions
    needs: [scenario-topology, scenario-multicluster-topology, scenario-topology-extensions]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CGO_ENABLED: '0'
      CEPH_TEST_RGW_IMAGE: ${{ inputs.rgw_image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-rgw-sync-native-regressions
      - run: make rgw-sync-native-regressions
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-rgw-sync-native-regressions

  scenario-mirror-initial-daemons:
    needs: scenario-default
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Record Testcontainers resource identities
        id: runtime_cleanup_baseline
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: snapshot
          artifact_name: runtime-cleanup-scenario-mirror-initial-daemons
      - name: Prepare published Ceph role images
        uses: ./.github/actions/scenario-images
        with:
          artifact_name: scenario-images-scenario-mirror-initial-daemons
      - run: make scenario-mirror-initial-daemons
      - name: Verify Testcontainers resource cleanup
        if: ${{ always() && steps.runtime_cleanup_baseline.outcome == 'success' }}
        uses: ./.github/actions/runtime-cleanup
        with:
          phase: check
          artifact_name: runtime-cleanup-scenario-mirror-initial-daemons

  scenario-rbd-namespaces:
    needs: scenario-default
    runs-on: ubuntu-24.04
