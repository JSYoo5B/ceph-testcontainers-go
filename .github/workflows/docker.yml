name: Docker checks

# Development runs the environment category. Release candidates run the full Release matrix.

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'internal/integration/goceph/**'
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'internal/integration/goceph/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: Scenarios
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      category: environment
      check_name: Docker checks
