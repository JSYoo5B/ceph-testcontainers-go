name: Short

# Development runs the current release. A PR can opt into declaration selection. Release candidates run the full Release matrix.

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'internal/integration/goceph/**'
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'internal/integration/goceph/**'
  workflow_dispatch:
    inputs:
      storage_policy:
        description: auto uses qualified headroom; always is the full-workflow reclamation control
        type: choice
        options: [auto, always]
        default: auto
      ref:
        description: Exact commit for a controlled full-workflow comparison; empty uses the dispatched branch
        type: string
        default: ''

permissions:
  contents: read

# Adding or removing a label other than ci:selected-batches starts a run that
# does nothing; its own group keeps it from cancelling the pull request's run
# in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:selected-batches' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: Scenarios
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ci:selected-batches'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      category: short
      # tag_scenarios.PULL_REQUEST_MAX_PARALLEL: one pull request does not
      # hold the account's runners.
      max_parallel: 8
      check_name: Short
      select_declarations: >-
        ${{ github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'ci:selected-batches') &&
        github.event.pull_request.base.sha || '' }}
      storage_policy: ${{ github.event_name == 'workflow_dispatch' && inputs.storage_policy || 'auto' }}
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
      save_caches: ${{ inputs.ref == '' || inputs.ref == github.sha }}
