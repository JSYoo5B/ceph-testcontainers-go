name: Code checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A weekly scan catches new advisories without a source change.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: go.sum
      - name: Run host unit tests
        run: make test

  race:
    name: Race detector
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: go.sum
      - name: Run race detector
        run: make race

  static:
    name: Vet, compile and CI tooling
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: go.sum
      - name: Vet Go packages
        run: make vet
      - name: Lint Go packages with every build tag
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=15m
      - name: Compile all and explicit optional tags without Docker
        run: make tag-compile
      - name: Check CI selection, image, cleanup and completion tooling without Docker
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check supplied-image Linux consumer harness without Docker
        run: python3 -m unittest discover -s internal/integration/goceph -p test_run.py -v

  tag-coverage:
    name: Compiled tag coverage and helpers
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: go.sum
      - name: Verify the full compiled all, category and batch partition
        run: python3 .github/scripts/tag_scenarios.py plan --verify --output artifacts/tag-plan.json
      - name: Run code-only tagged helpers
        run: python3 .github/scripts/tag_scenarios.py code --directory artifacts/tag-code
      - name: Save compiled coverage and code-only results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-tag-coverage
          path: |
            artifacts/tag-plan.json
            artifacts/tag-code/
          if-no-files-found: warn

  # govulncheck with the module's minimum and the current Go release, for
  # every platform and tag set that make vulncheck lists. Docker-free.
  vulncheck:
    name: Vulnerability check (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            internal/integration/goceph/probe/go.sum
      - name: Scan source and required modules
        run: make vulncheck VULNCHECK_DIR=artifacts/vulncheck
      - name: Save the scans
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulncheck-go-${{ matrix.go }}
          path: artifacts/vulncheck/*.json
          if-no-files-found: warn
