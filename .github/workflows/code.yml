name: Code checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A weekly scan catches new advisories without a source change.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

env:
  # A failed request to the module proxy, such as a reset HTTP/2 stream,
  # falls back to the module's origin; go.sum verifies either source.
  GOPROXY: 'https://proxy.golang.org|direct'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

# Go jobs restore the module cache that the Plan job of tagged-runtime.yml
# saves after downloading every module. Build caches are shared by exact Go
# version; only default-branch vulnerability checks fill a missing one here.
jobs:
  # Decides whether a pull request changes only documentation that no check
  # reads (see docs/contributing/ci.md). The jobs below stay in every run
  # because their names are required status checks; they skip themselves
  # instead, and a skipped job reports success. Anything but an explicit
  # docs_only=true, including a failure of this job, runs every check.
  changes:
    name: Detect documentation-only changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$EVENT" = pull_request ] && [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin "$BASE" || true
          fi
          python3 .github/scripts/docs_only.py --event "$EVENT" --base "$BASE" --fork "$FORK"

  unit:
    name: Unit tests
    needs: changes
    if: ${{ github.event_name != 'schedule' && !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Run host unit tests
        run: make test

  race:
    name: Race detector
    needs: changes
    if: ${{ github.event_name != 'schedule' && !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Run race detector
        run: make race

  static:
    name: Vet, compile and CI tooling
    needs: changes
    if: ${{ github.event_name != 'schedule' && !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Vet Go packages
        run: make vet
      - name: Lint Go packages with every build tag
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=15m
      - name: Compile all and explicit optional tags without Docker
        run: make tag-compile
      - name: Check CI selection, image, cleanup and completion tooling without Docker
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      # Parses every workflow as YAML and resolves reusable-workflow calls,
      # which the regex-based tooling tests above cannot. actionlint does not
      # know job.check_run_id yet.
      - name: Lint workflow syntax and reusable-workflow calls
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          -shellcheck= -pyflakes=
          -ignore 'property "check_run_id" is not defined'
      - name: Check supplied-image Linux consumer harness without Docker
        run: python3 -m unittest discover -s internal/integration/goceph -p test_run.py -v

  tag-coverage:
    name: Compiled tag coverage and helpers
    needs: changes
    if: ${{ github.event_name != 'schedule' && !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Verify the full compiled all, category and batch partition
        run: python3 .github/scripts/tag_scenarios.py plan --verify --output artifacts/tag-plan.json
      - name: Run code-only tagged helpers
        run: python3 .github/scripts/tag_scenarios.py code --directory artifacts/tag-code
      - name: Save compiled coverage and code-only results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ job.status == 'failure' && 14 || 7 }}
          name: code-tag-coverage
          path: |
            artifacts/tag-plan.json
            artifacts/tag-code/
          if-no-files-found: warn

  # govulncheck with the module's minimum and the current Go release, for
  # every platform and tag set that make vulncheck lists. Docker-free.
  vulncheck:
    name: Vulnerability check (Go ${{ matrix.go }})
    needs: changes
    # A matrix job skipped by a job-level condition might report under its
    # unexpanded name, which would leave the required check pending. The job
    # therefore always runs, and a documentation-only change skips its steps.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/setup-go@v7
        id: go
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: false
      - name: Restore the Go module cache
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Restore the Go build cache
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        id: build_cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - name: Scan source and required modules
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make vulncheck VULNCHECK_DIR=artifacts/vulncheck
      # The minimum Go version normally finds Plan's cache. A scheduled or
      # main run can fill a cache for the other toolchain without storing a
      # second copy of the module cache or saving PR-scoped build caches.
      - name: Save the Go build cache
        if: >-
          needs.changes.outputs.docs_only != 'true' &&
          steps.build_cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - name: Save the scans
        if: ${{ always() && needs.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ job.status == 'failure' && 14 || 7 }}
          name: vulncheck-go-${{ matrix.go }}
          path: artifacts/vulncheck/*.json
          if-no-files-found: warn
