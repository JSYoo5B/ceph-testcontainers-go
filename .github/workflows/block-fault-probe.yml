name: Block fault probe

# Research probe for issue #7: delay and I/O-error tables on a test-owned
# sparse file, loop device and device-mapper mapping, without Ceph. It runs
# only on a disposable hosted runner and is not a required check.
on:
  pull_request:
    paths:
      - .github/scripts/block_fault_probe.py
      - .github/scripts/test_block_fault_probe.py
      - .github/workflows/block-fault-probe.yml
  workflow_dispatch:
    inputs:
      public_api:
        description: Qualify the public blockio API on every supported release
        type: boolean
        default: false
      prepare_kernel:
        description: Allow loop and dm_delay module setup on this disposable hosted runner
        type: boolean
        default: false

permissions:
  contents: read

env:
  GOPROXY: 'https://proxy.golang.org|direct'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  probe:
    if: ${{ !inputs.public_api }}
    name: Scratch device probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the probe unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_block_fault_probe.py' -v
      - name: Run the probe
        # The runner's existing tools and kernel modules are used as they are.
        # --allow-target-autoload lets a table load trigger the kernel's
        # on-demand load of an installed dm_delay or dm_flakey module.
        run: |
          mkdir -p "$RUNNER_TEMP/block-fault" artifacts
          status=0
          sudo -n python3 -I .github/scripts/block_fault_probe.py run \
            --directory "$RUNNER_TEMP/block-fault" \
            --output artifacts/block-fault-report.json \
            --allow-target-autoload || status=$?
          sudo -n chown "$(id -u):$(id -g)" artifacts/block-fault-report.json || true
          {
            echo "### Block fault probe"
            echo
            jq -r '"Verdict: **\(.verdict)**", "",
              "| Phase | Effect | Restore |", "| --- | --- | --- |",
              (.phases[] | "| \(.name) | \(.effect // .outcome) | \(.restore.outcome // "") |")' \
              artifacts/block-fault-report.json
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - name: Upload the probe report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: block-fault-report
          path: artifacts/block-fault-report.json
          retention-days: 30
          if-no-files-found: warn

  public-api:
    if: github.event_name == 'workflow_dispatch' && inputs.public_api
    name: Public block I/O / ${{ matrix.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release: ['20.2.4', '21.2.0', '19.2.5']
    env:
      CGO_ENABLED: '0'
      TESTCONTAINERS_HOST_OVERRIDE: '127.0.0.1'
      CEPH_TEST_BLOCKIO_REQUIRE_DELAY: '1'
      HELPER_REVISION: 711be98130c5173ef63ce56edf48fbdbdfe086ba
      CEPH_RELEASE: ${{ matrix.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: JSYoo5B/ceph-testcontainers-images
          ref: 711be98130c5173ef63ce56edf48fbdbdfe086ba
          path: helper-source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Prepare the explicitly admitted disposable kernel
        if: inputs.prepare_kernel
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n modprobe loop
          sudo -n modprobe dm_delay
      - name: Build and quick-check the pinned helper
        run: |
          test "$(git -C helper-source rev-parse HEAD)" = "$HELPER_REVISION"
          mkdir -p artifacts/blockio
          docker build --tag blockio-qualification:local helper-source/image/extensions/blockio
          helper=$(docker image inspect --format '{{.Id}}' blockio-qualification:local)
          echo "CEPH_TEST_BLOCKIO_HELPER_IMAGE=$helper" >> "$GITHUB_ENV"
          python3 helper-source/image/extension_check.py --extension blockio --image "$helper" \
            > artifacts/blockio/helper-check.log
          printf '%s\n' "$GITHUB_SHA" "$HELPER_REVISION" "$helper" > artifacts/blockio/sources.txt
      # The published role tags of the release, resolved once to local image
      # IDs for the tests; the summary under artifacts/blockio/role-images
      # records the registry digests this run pulled.
      - name: Prepare the published Ceph role images
        run: >-
          python3 .github/scripts/run_image_matrix.py --variant official --layout roles
          --release "$CEPH_RELEASE" --prepare-only --roles essential,client
          --github-env "$GITHUB_ENV" --output-dir artifacts/blockio/role-images
      - uses: ./.github/actions/runtime-cleanup
        id: baseline
        with:
          phase: snapshot
          directory: artifacts/blockio/cleanup
          artifact_name: blockio-cleanup-${{ matrix.release }}
      - name: Compile the source-owned public API batch
        run: >-
          python3 .github/scripts/tag_scenarios.py compile --category optional
          --batch block_io --package ./internal/integration
          --directory artifacts/blockio/compile
      - name: Qualify delay, EIO, recovery and lifetime through the public API
        run: >-
          python3 .github/scripts/tag_scenarios.py optional --batch block_io
          --package ./internal/integration --binary artifacts/blockio/compile
          --directory artifacts/blockio/native
      - uses: ./.github/actions/runtime-cleanup
        if: always() && steps.baseline.outcome == 'success'
        with:
          phase: check
          directory: artifacts/blockio/cleanup
          artifact_name: blockio-cleanup-${{ matrix.release }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-blockio-${{ matrix.release }}
          path: artifacts/blockio/
          retention-days: 14
          if-no-files-found: warn
