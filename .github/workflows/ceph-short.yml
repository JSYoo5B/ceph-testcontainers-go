name: Ceph short

# Runtime batches never read documentation or the separately built go-ceph
# probe module, so a change to those alone runs only Code checks.
#
# Every batch runs on every pull request unless it opts in to declaration
# selection with ci:selected-batches outside a release phase (CI_RELEASE_PHASE
# "true"). Manual runs cover every batch; Ceph periodic covers main.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'internal/integration/goceph/**'
  workflow_dispatch:
    inputs:
      storage_policy:
        description: auto uses qualified headroom; always is the full-workflow reclamation control
        type: choice
        options: [auto, always]
        default: auto
      ref:
        description: Exact commit for a controlled full-workflow comparison; empty uses the dispatched branch
        type: string
        default: ''

permissions:
  contents: read

# Adding or removing a label other than ci:selected-batches starts a run that
# does nothing; its own group keeps it from cancelling the pull request's run
# in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:selected-batches' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: Scenarios
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ci:selected-batches'
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      category: short
      check_name: Ceph short
      select_declarations: >-
        ${{ github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'ci:selected-batches') &&
        vars.CI_RELEASE_PHASE != 'true' &&
        github.event.pull_request.base.sha || '' }}
      storage_policy: ${{ github.event_name == 'workflow_dispatch' && inputs.storage_policy || 'auto' }}
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
