name: Ceph short

# Runtime batches never read documentation or the separately built go-ceph
# probe module, so a change to those alone runs only Code checks.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'internal/integration/goceph/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'internal/integration/goceph/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: Scenarios
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      category: short
      check_name: Ceph short
