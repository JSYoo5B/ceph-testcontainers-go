name: Release matrix

# Validate every release-bound category plus the environment on the event's
# immutable candidate commit (PR integration commit or maintained branch tip).
# A push to release/X.Y runs none: that line follows develop, and its
# candidate is validated once, by its promotion PR to main
# (docs/contributing/ci.md, "Release candidate validation").
# rehearsal/promotion is not a line: it exists only while the promotion
# path is rehearsed end to end (docs/contributing/ci.md, "Rehearsing a
# promotion").
on:
  push:
    branches: [main, 'support/**', rehearsal/promotion]
  pull_request:
    branches: [main, 'release/**', 'support/**', rehearsal/promotion]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  # The promotion receipts read this and the promotion run's jobs and
  # artifacts.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

env:
  # A failed request to the module proxy, such as a reset HTTP/2 stream,
  # falls back to the module's origin; go.sum verifies either source.
  GOPROXY: 'https://proxy.golang.org|direct'

jobs:
  releases:
    name: Releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      count: ${{ steps.releases.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      # Fails unless the callers run every required profile on each supported
      # release exactly once.
      - name: Expand supported releases and prove required coverage
        id: releases
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 .github/scripts/tag_scenarios.py releases --scope all --allocation release --check-prefix 'Release matrix' --github-output "$GITHUB_OUTPUT" | tee artifacts/release-coverage.json
      # The coverage digest and image references of this tree, for the
      # promotion receipts.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-coverage-${{ github.run_attempt }}
          path: artifacts/release-coverage.json
          retention-days: 14
          if-no-files-found: warn
  # A push to main (or to the rehearsal branch) that is the protected merge
  # of a promotion PR, with the
  # tree and parents that the PR's Release matrix tested, reuses that run
  # instead of a second matrix (docs/contributing/ci.md, "Promotion reuse").
  # Anything else, a failure of this job included, runs the full matrix.
  reuse:
    name: Promotion reuse
    needs: releases
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rehearsal/promotion')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reused: ${{ steps.verify.outputs.reused }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-coverage-${{ github.run_attempt }}
          path: artifacts
      - name: Qualify the push with its promotion run
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/promotion_reuse.py verify --coverage artifacts/release-coverage.json --output artifacts/promotion-reuse
      # The decision and, on a reuse, this publication's own copy of the job
      # records that qualified it.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: promotion-reuse-receipt-${{ github.run_attempt }}
          path: artifacts/promotion-reuse/
          retention-days: 90
          if-no-files-found: warn
  runtime:
    name: ${{ matrix.title }}
    needs: [releases, reuse]
    if: ${{ !cancelled() && needs.releases.result == 'success' && needs.reuse.outputs.reused != 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.releases.outputs.matrix) }}
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      require_profiles: true
      networks: all
      category: ${{ matrix.category }}
      check_name: ${{ matrix.check_name }}
      release: ${{ matrix.release }}
      # tag_scenarios.release_max_parallel: the callers together take every
      # runner but tag_scenarios.OTHER_REPOSITORY_RUNNERS; see
      # docs/contributing/ci.md.
      max_parallel: ${{ matrix.max_parallel }}
  environment:
    name: Environment
    needs: [releases, reuse]
    if: ${{ !cancelled() && needs.releases.result == 'success' && needs.reuse.outputs.reused != 'true' }}
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      category: environment
      require_profiles: true
      networks: all
      check_name: Release matrix environment
      # tag_scenarios.ENVIRONMENT_MAX_PARALLEL
      max_parallel: 1
  validated:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual release matrix' || 'Release candidate validated' }} (${{ github.base_ref || github.ref_name }})
    if: always()
    needs: [releases, reuse, runtime, environment]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the complete matrix or a verified promotion reuse
        env:
          PLANNER: ${{ needs.releases.result }}
          REUSE: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.reused }}
          RUNTIME: ${{ needs.runtime.result }}
          ENVIRONMENT: ${{ needs.environment.result }}
          COUNT: ${{ needs.releases.outputs.count }}
        run: |
          test "$PLANNER" = success
          test "$COUNT" -gt 0
          if [ "$REUSE" = success ] && [ "$REUSED" = true ]; then
            echo "The promotion run of this merge qualifies it; see the promotion-reuse-receipt artifact."
            exit 0
          fi
          test "$RUNTIME" = success
          test "$ENVIRONMENT" = success
  # The candidate receipt of a validated promotion run: what the workflow
  # checked out, what it covered, which first failures a retry passed, and
  # the history row of every runtime job with its retry report. The jobs' own
  # artifacts expire weeks before the receipt, so their records are kept with
  # it. The push of the protected merge reads both. A failure here leaves the
  # gate's result as it is and only makes that push run its full matrix.
  receipt:
    name: Candidate receipt
    needs: [releases, validated]
    # Only a promotion to main, or its rehearsal, is reused, so only they
    # keep the records.
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'rehearsal/promotion') && needs.validated.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-coverage-${{ github.run_attempt }}
          path: artifacts/coverage
      - name: Download this run's job records
        uses: actions/download-artifact@v8
        with:
          pattern: tag-scenario-*
          path: artifacts/rows
      - name: Record the candidate receipt and its evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/promotion_reuse.py record --coverage artifacts/coverage/release-coverage.json --rows artifacts/rows --output artifacts/release-candidate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-candidate-receipt-${{ github.run_attempt }}
          path: artifacts/release-candidate/
          retention-days: 90
          if-no-files-found: warn
