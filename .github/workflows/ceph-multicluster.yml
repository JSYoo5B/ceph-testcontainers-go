name: Ceph multicluster

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: Scenarios
    uses: ./.github/workflows/tagged-runtime.yml
    with:
      category: multicluster
      check_name: Ceph multicluster
